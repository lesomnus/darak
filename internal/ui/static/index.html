<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>파일 서버</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- 로그인 -->
<section id="login" hidden>
  <form id="login-form">
    <h1>파일 서버</h1>
    <p class="muted">회사 계정으로 로그인하세요.</p>
    <label>아이디<input name="user" autocomplete="username" autocapitalize="none" autocorrect="off" required></label>
    <label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label>
    <p id="login-error" class="error" hidden></p>
    <button type="submit">로그인</button>
    <p class="muted small">탐색기에서 쓰는 비밀번호와 같습니다.</p>
  </form>
</section>

<!-- 본문 -->
<section id="app" hidden>
  <header>
    <button id="home-btn" class="icon" title="처음으로">📁</button>
    <nav id="crumbs" aria-label="위치"></nav>
    <span class="spacer"></span>
    <button id="shares-btn" class="ghost">공유 링크</button>
    <span id="who" class="muted small"></span>
    <button id="logout-btn" class="ghost">로그아웃</button>
  </header>

  <div id="toolbar">
    <button id="upload-btn">파일 올리기</button>
    <button id="mkdir-btn" class="ghost">새 폴더</button>
    <button id="trash-btn" class="ghost">휴지통</button>
    <input id="file-input" type="file" multiple hidden>
  </div>

  <div id="drop-hint" hidden>여기에 놓으면 올라갑니다</div>
  <div id="progress" hidden><div id="progress-bar"></div><span id="progress-text"></span></div>
  <p id="app-error" class="error" hidden></p>

  <main id="listing" aria-live="polite"></main>
</section>

<!-- 공유 링크 만들기 -->
<dialog id="share-dialog">
  <form method="dialog">
    <h2>공유 링크 만들기</h2>
    <p id="share-target" class="muted small"></p>
    <label>비밀번호 <span class="muted small">(비워두면 링크만으로 열림)</span>
      <input id="share-password" type="text" autocomplete="off"></label>
    <label>유효 기간
      <select id="share-ttl">
        <option value="24">1일</option>
        <option value="168" selected>7일</option>
        <option value="720">30일</option>
      </select></label>
    <menu>
      <button value="cancel" class="ghost">취소</button>
      <button id="share-create" value="create">만들기</button>
    </menu>
  </form>
</dialog>

<!-- 공유 링크 목록 -->
<dialog id="shares-dialog">
  <h2>내가 만든 공유 링크</h2>
  <div id="shares-list"></div>
  <menu><button id="shares-close" class="ghost">닫기</button></menu>
</dialog>

<script src="/app.js"></script>
</body>
</html>
