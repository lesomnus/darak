version: v2
inputs:
  - directory: proto
plugins:
  - local: [go, tool, google.golang.org/protobuf/cmd/protoc-gen-go]
    out: .
    opt:
      - module=github.com/lesomnus/darak
      - default_api_level=API_OPEN
    strategy: all
  - local: [go, tool, google.golang.org/grpc/cmd/protoc-gen-go-grpc]
    out: .
    opt:
      - module=github.com/lesomnus/darak
    strategy: all
