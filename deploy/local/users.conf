# Accounts for the local test stack.
#
# The uid and gid numbers are pinned HERE, not allocated by useradd, and that is
# the whole reason this file works. Container filesystems are thrown away on
# every rebuild, so /etc/passwd is derived state; the volume holding the data
# knows its owners only as numbers. Pin the numbers and the accounts can be
# recreated from scratch on every boot with the files still belonging to the
# right people.
#
# It is the same argument the AD migration rests on (see nas-design.md ADR-8):
# what has to survive is the number, not the record that names it. In production
# this file is roster.yaml and usersync applies it; here a small script stands in
# so the stack needs no second repository.
#
#   group <name> <gid>
#   user  <name> <uid> [comma,separated,groups]
#
# Ranges match the reserved band: uid 3000-9999, team gid 10000-19999.

group team-a 10001
group team-b 10002

user alice 3001 team-a
user bob   3002 team-a,team-b
user carol 3003 team-b
user dave  3004

# Who may reach the operator page (the `admin` POSIX group).
#
# Not a `group` line: that would also make a team folder and an SMB share, and
# being allowed to manage accounts should not create a shared directory. The
# group is made at gid 2000, below the managed band, so it is never mistaken
# for a team.
#
#   admin <name> [<name> ...]
admin alice
